
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediTrack Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>💊 MediTrack</h2>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <section class="roles">

        <h2 id="registerTitle">Create Account</h2>

        <div class="card" style="margin:30px auto; max-width:400px;">

            <form id="registerForm">

                <!-- User Fields -->
                <div id="userFields">

                    <input type="text" id="name"
                        placeholder="Full Name"><br><br>

                    <input type="text" id="phone"
                        placeholder="Phone Number"><br><br>

                    <input type="text" id="address"
                        placeholder="Address"><br><br>

                </div>

                <!-- Medical Shop Fields -->
                <div id="shopFields" style="display:none;">

                    <input type="text" id="shopName"
                        placeholder="Medical Shop Name"><br><br>

                    <input type="text" id="ownerName"
                        placeholder="Owner Name"><br><br>

                    <input type="text" id="shopPhone"
                        placeholder="Phone Number"><br><br>

                    <input type="text" id="shopAddress"
                        placeholder="Shop Address"><br><br>

                    <input type="number" id="latitude"
                        placeholder="Latitude" step="any"><br><br>

                    <input type="number" id="longitude"
                        placeholder="Longitude" step="any"><br><br>

                </div>

                <input type="email" id="email"
                    placeholder="Email Address" required><br><br>

                <input type="password" id="password"
                    placeholder="Password" required><br><br>

                <button type="submit">Register</button>

                <p id="message" style="margin-top:15px;"></p>

                <p style="margin-top:15px;">
                    Already have an account?
                    <a id="loginLink" href="login.html">Login</a>
                </p>

            </form>

        </div>

    </section>

    <script src="register.js"></script>

</body>
</html>
